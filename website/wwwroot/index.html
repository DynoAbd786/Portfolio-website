    <div id="blazor-error-ui"
        style="background: rgba(0,0,0,0.9); color: white; position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 10000; padding: 2rem; display: none; font-family: monospace;">
        <div
            style="max-width: 800px; margin: 0 auto; background: #1a1a1a; border: 2px solid #ef4444; border-radius: 8px; padding: 2rem;">
            <div style="display: flex; align-items: center; margin-bottom: 1rem;">
                <span style="color: #ef4444; font-size: 2rem; margin-right: 1rem;">⚠️</span>
                <h2 style="color: #ef4444; margin: 0;">Unhandled Blazor Error</h2>
            </div>
            <div id="blazor-error-details"
                style="background: #0a0a0a; border: 1px solid #333; border-radius: 4px; padding: 1rem; margin: 1rem 0; white-space: pre-wrap; overflow: auto; max-height: 400px;">
                <div style="color: #888;">Loading error details...</div>
            </div>
            <div style="display: flex; gap: 1rem; margin-top: 1rem;">
                <a href="" class="reload"
                    style="background: #ef4444; color: white; padding: 0.5rem 1rem; border-radius: 4px; text-decoration: none; font-weight: bold;">🔄
                    Reload</a>
                <a class="dismiss"
                    style="background: #333; color: white; padding: 0.5rem 1rem; border-radius: 4px; text-decoration: none; cursor: pointer;">🗙
                    Dismiss</a>
                <button
                    onclick="navigator.clipboard.writeText(document.getElementById('blazor-error-details').textContent)"
                    style="background: #0891b2; color: white; padding: 0.5rem 1rem; border: none; border-radius: 4px; cursor: pointer;">📋
                    Copy Error</button>
            </div>
        </div>
    </div>
    <script>
        // Global error handler to capture Blazor exceptions
        window.addEventListener('error', function (e) {
            console.error('[Global Error Handler]', e.error || e.message);
            updateErrorDisplay(e.error || new Error(e.message), 'Global Error');
        });

        window.addEventListener('unhandledrejection', function (e) {
            console.error('[Unhandled Promise Rejection]', e.reason);
            updateErrorDisplay(e.reason, 'Promise Rejection');
        });

        function updateErrorDisplay(error, source) {
            const errorDetails = document.getElementById('blazor-error-details');
            const errorUI = document.getElementById('blazor-error-ui');

            if (errorDetails && errorUI) {
                const errorInfo = `
Source: ${source}
Error Type: ${error.name || 'Unknown'}
Message: ${error.message || 'No message available'}
Stack Trace:
${error.stack || 'No stack trace available'}

Time: ${new Date().toISOString()}
User Agent: ${navigator.userAgent}
URL: ${window.location.href}
                `.trim();

                errorDetails.innerHTML = `<div style="color: #ff6b6b;">${errorInfo}</div>`;
                errorUI.style.display = 'block';
            }
        }

        // Blazor specific error handling
        window.Blazor = window.Blazor || {};
        window.Blazor.start = window.Blazor.start || function () { };

        const originalStart = window.Blazor.start;
        window.Blazor.start = function () {
            console.log('[Blazor] Starting application...');
            try {
                return originalStart.apply(this, arguments);
            } catch (error) {
                console.error('[Blazor Start Error]', error);
                updateErrorDisplay(error, 'Blazor Start');
                throw error;
            }
        };
    </script>

    <script src="_framework/blazor.webassembly.js"></script>

    <!-- Enhanced project card hover effects -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            console.log('[ProjectCards] Initializing enhanced hover effects...');

            // Add smooth hover effects to project cards
            const projectCards = document.querySelectorAll(".project-card-container");

            projectCards.forEach(card => {
                const projectCard = card.querySelector('.project-card');

                card.addEventListener('mouseenter', function () {
                    // Smooth lift effect with glow
                    projectCard.style.transform = 'translateY(-8px) scale(1.02)';
                    projectCard.style.boxShadow = '0 20px 40px rgba(6, 182, 212, 0.3), 0 0 20px rgba(6, 182, 212, 0.1)';
                });

                card.addEventListener('mouseleave', function () {
                    // Return to normal
                    projectCard.style.transform = 'translateY(0) scale(1)';
                    projectCard.style.boxShadow = '';
                });
            });

            console.log(`[ProjectCards] Enhanced effects applied to ${projectCards.length} cards`);
        });

        function toggleMobileMenu() {
            try {
                const mobileMenu = document.getElementById('mobile-menu');
                const menuIcon = document.getElementById('menu-icon');

                if (mobileMenu && menuIcon) {
                    if (mobileMenu.classList.contains('hidden')) {
                        mobileMenu.classList.remove('hidden');
                        menuIcon.classList.remove('fa-bars');
                        menuIcon.classList.add('fa-times');
                    } else {
                        mobileMenu.classList.add('hidden');
                        menuIcon.classList.remove('fa-times');
                        menuIcon.classList.add('fa-bars');
                    }
                } else {
                    console.warn('[toggleMobileMenu] Elements not found:', { mobileMenu, menuIcon });
                }
            } catch (error) {
                console.error('[toggleMobileMenu] Error:', error);
                updateErrorDisplay(error, 'Mobile Menu Toggle');
            }
        }

        window.messageUtils = {
            scrollToBottom: function (elementId) {
                var element = document.getElementById(elementId);
                if (element) {
                    element.scrollTop = element.scrollHeight;
                }
            },
            highlightAll: function () {
                if (window.hljs) {
                    document.querySelectorAll('pre code').forEach((el) => {
                        if (!el.dataset.highlighted) {
                            window.hljs.highlightElement(el);
                            el.dataset.highlighted = 'true';
                        }
                    });
                }
            },
            renderMath: function (elementId) {
                var element = document.getElementById(elementId);
                if (element && window.renderMathInElement) {
                    window.renderMathInElement(element, {
                        delimiters: [
                            { left: '$$', right: '$$', display: true },
                            { left: '$', right: '$', display: false },
                            { left: '\\(', right: '\\)', display: false },
                            { left: '\\[', right: '\\]', display: true }
                        ],
                        throwOnError: false
                    });
                }
            }
        };
    </script>
