<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Blazor Portfolio</title>
    <base href="/" />
    <link rel="stylesheet" href="css/app.css" />
    <!-- Tailwind CSS - Local production build -->
    <link rel="stylesheet" href="css/tailwind.min.css" />
    <style>
        /* Custom Tailwind configuration for portfolio */
        :root {
            --tw-text-opacity: 1;
        }

        .dark { color-scheme: dark; }
        .font-mono { font-family: "Source Code Pro", monospace; }

        /* Ensure all elements use dark theme by default */
        body {
            background-color: #111827;
            color: #f9fafb;
        }

        /* Custom color utilities matching your design */
        .text-cyan-400 { color: #22d3ee; }
        .text-gray-300 { color: #d1d5db; }
        .text-gray-400 { color: #9ca3af; }
        .bg-gray-800 { background-color: #1f2937; }
        .bg-gray-900 { background-color: #111827; }
        .border-gray-700 { border-color: #374151; }
        .border-cyan-500 { border-color: #06b6d4; }
        .hover\:border-cyan-500\/50:hover { border-color: rgba(6, 182, 212, 0.5); }
        .bg-cyan-500 { background-color: #06b6d4; }
        .hover\:bg-cyan-400:hover { background-color: #22d3ee; }

        /* Gradient utilities */
        .bg-gradient-to-r { background-image: linear-gradient(to right, var(--tw-gradient-stops)); }
        .from-cyan-500 { --tw-gradient-from: #06b6d4; --tw-gradient-stops: var(--tw-gradient-from), var(--tw-gradient-to, rgba(6, 182, 212, 0)); }
        .to-blue-500 { --tw-gradient-to: #3b82f6; }
    </style>
    <!-- Font Awesome for social icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=Source+Code+Pro:wght@400;700;900&display=swap" rel="stylesheet">
</head>

<body>
    <div id="app">
        <!-- Cool loading animation -->
        <div style="position:fixed;top:0;left:0;width:100%;height:100%;display:flex;justify-content:center;align-items:center;background-color:#111827;">
            <div class="loader"></div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <!-- Script for the 3D tilt effect on project cards -->
    <script src="js/vanilla-tilt.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            if (typeof VanillaTilt !== 'undefined') {
                VanillaTilt.init(document.querySelectorAll(".project-card-container"), {
                    max: 15,
                    speed: 400,
                    glare: true,
                    "max-glare": 0.5
                });
            }
        });

        function toggleMobileMenu() {
            const mobileMenu = document.getElementById('mobile-menu');
            const menuIcon = document.getElementById('menu-icon');
            
            if (mobileMenu.classList.contains('hidden')) {
                mobileMenu.classList.remove('hidden');
                menuIcon.classList.remove('fa-bars');
                menuIcon.classList.add('fa-times');
            } else {
                mobileMenu.classList.add('hidden');
                menuIcon.classList.remove('fa-times');
                menuIcon.classList.add('fa-bars');
            }
        }
    </script>
</body>
</html>
