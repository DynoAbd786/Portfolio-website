services:
  - type: web
    name: portfolio-website
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    branch: main
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:10000
    buildFilter:
      paths:
        - website/**
        - website.api/**
        - Dockerfile
        - render.yaml